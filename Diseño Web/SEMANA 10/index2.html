<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header></header>
    <main>
        <section>
            <h3>Formulario par actualizar </h3>
            <form id="formularioActualizar" action="index.html">
                <div>
                    <label for="posicion">Posicion</label>
                    <input type="number" id="posicion" placeholder="Posición de elemento" required>
                </div>
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre" required>
                </div>
                <div>
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" placeholder="Edad" required>
                </div>
                <button type="submit">ACTUALIZAR</button>
            </form>
        </section>
        <section>
            <h3>Formulario para eliminar</h3>
            <form id="FormularioEliminar" action="index.html">
                <div>
                    <label for="posicionEliminar">Posicion</label>
                    <input type="number" id="posicionEliminar" placeholder="Posicion" required>
                </div>
                <button type="submit">Eliminar</button>
            </form>
        </section>
    </main>
    <aside></aside>
    <footer></footer>
    <script src="app2.js"></script>
</body>
</html>
