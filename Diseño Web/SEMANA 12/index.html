<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <h1>Titulo 1</h1>
    <button class="btn btn-primary mt-3">Boton</button>
    <button class="btn btn-secondary ms-4 me-2">Boton 2</button>
    <button class="btn btn-danger mb-5">Boton 3</button>
    <button class="btn btn-warning pt-4 pb-3 ps-4 pe-5">Boton 4</button>
    <button class="btn btn-dark py-3 px-4">Boton 5</button>
    <button class="btn btn-outline-primary m-5">Boton 6</button>
    <button class="btn btn-outline-secondary p-5">Boton 7</button>
    <hr>
    <div class="container">
        <h3 class="text-center">Formulario</h3>
        <form class="row">
            <div class="col-8">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre">
            </div>
            <div class="col-4">
                <label for="edad">Edad</label>
                <input type="number" class="form-control" id="edad">
            </div>
            <div class="col-12">
                <label for="direccion">Direccion</label>
                <input type="text" class="form-control" id="direccion">
            </div>
            <button class="btn btn-primary btn-lg">Guardar</button>
        </form>
    </div>   
    <div class="table responsive"> 
        <table class="table table-bordered table-striped table-hover table-hover">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Direccion</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Juan</td>
                    <td>25</td>
                    <td>Calle 123</td>
                </tr>
                <tr>
                    <td>Maria</td>
                    <td>30</td>
                    <td>Avenida 456</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
